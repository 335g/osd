[package]
name = "osd-app"
version = "0.1.0"
edition = "2021"
description = "osd の GUI（rune 製）"

[dependencies]
osd-api = { path = "../osd-api" }
rune = { git = "https://github.com/anomalyco/rune", rev = "44920b1fdfe6d1b7156d80b90f0ca0d96080d2bf" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "44920b1fdfe6d1b7156d80b90f0ca0d96080d2bf", features = ["markdown", "mermaid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
