<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osd</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="vendor/vega.min.js"></script>
<script src="vendor/vega-lite.min.js"></script>
<script src="vendor/vega-embed.min.js"></script>
</head>
<body>
<header id="topbar">
  <strong class="brand">osd</strong>
  <span id="project" class="muted-on-dark"></span>
  <span class="spacer"></span>
  <span id="status" class="muted-on-dark"></span>
  <span id="pending" class="pending" hidden>Piが考えています…</span>
  <button id="btn-fold-all" class="btn-ghost">すべてたたむ</button>
  <button id="btn-finish" class="btn-light">理解を終える</button>
</header>

<main id="board" aria-label="ホワイトボード">
  <div id="world">
    <svg id="wires" aria-hidden="true"></svg>
    <article id="main-card" class="main-card">
      <p class="eyebrow">本筋（Piの出力）</p>
      <div id="main-body" class="md selectable" data-source="main"></div>
    </article>
  </div>
</main>

<div id="toolbar" role="toolbar" aria-label="ボードの操作">
  <button id="btn-memo">メモ付箋</button>
  <button id="btn-arrange">整列</button>
  <button id="btn-home">本筋へ移動</button>
  <button id="btn-zoom-out" aria-label="縮小">－</button>
  <span id="zoom-label">100%</span>
  <button id="btn-zoom-in" aria-label="拡大">＋</button>
</div>

<div id="sel-menu" role="menu" aria-label="選択した箇所へのアクション" hidden>
  <button data-action="question" class="primary">質問する</button>
  <button data-action="detail">もっと詳しく</button>
  <button data-action="term">用語を調べる</button>
  <button data-action="diagram">図で見る</button>
  <button data-action="review">レビュー</button>
  <button data-action="memo">メモ</button>
</div>

<div id="def-pop" class="def-pop" hidden>
  <div class="def-head">
    <span id="def-word" class="def-word"></span>
    <button id="def-close" class="def-x" aria-label="閉じる">×</button>
  </div>
  <div id="def-body" class="def-body md"></div>
  <div class="def-actions">
    <button id="def-sticky" class="btn-mini">付箋にする</button>
  </div>
</div>

<div id="return-modal" class="modal-backdrop" hidden>
  <section class="modal" role="dialog" aria-labelledby="ret-title">
    <h1 id="ret-title">理解を終えて、メインに戻ります</h1>
    <p class="muted">付箋の質問と回答をすべてサマリーして、次のプロンプトとしてメインに送ります。</p>
    <div class="row">
      <label for="ret-text" class="label">メインに送る次のプロンプト</label>
      <span class="spacer"></span>
      <button id="btn-draft" class="btn-outline">全付箋をサマリーして次のプロンプトを作る</button>
    </div>
    <textarea id="ret-text" rows="7" placeholder="「サマリー」を押すと、付箋のやりとりから次のプロンプトが入ります"></textarea>
    <p class="muted small">送ると、付箋と会話はすべて破棄されます。</p>
    <div class="row end">
      <button id="btn-ret-back" class="btn-outline">ボードに戻る</button>
      <button id="btn-ret-none" class="btn-outline">何も返さず閉じる</button>
      <button id="btn-ret-send" class="btn-primary">メインに送って閉じる</button>
    </div>
  </section>
</div>

<div id="done" class="done" hidden>
  <div>
    <h1>osdを閉じました</h1>
    <p>Pi に戻って「終わった」と伝えてください。このタブは閉じて大丈夫です。</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
