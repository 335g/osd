[package]
name = "osd-server"
version = "0.1.0"
edition = "2021"
description = "osd ブリッジ API サーバ（pi のフォークで付箋の質問に答える）"

[[bin]]
name = "osd-server"
path = "src/main.rs"

[dependencies]
osd-api = { path = "../osd-api" }
axum = "0.8.9"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal", "io-util"] }
